 ],events:[]};}
function transition(state,id,action,data={}){
 const next=structuredClone(state), c=next.cabinets.find(x=>x.id===id);
 if(!c)throw Error('找不到配电柜记录');
 let actor='',text='';
 if(action==='dispatch'){
  if(c.status!=='draft')throw Error('只有资料草稿可以交给现场');
  if(!c.door||!c.room)throw Error('请先补齐舱室和柜门资料');
  c.status='binding';actor='陈宁 · 资料维护';text='资料交给现场核对与绑定';
 }else if(action==='bind'){
  if(c.status!=='binding')throw Error('当前记录不在待绑定状态');
  const lock=(data.lock||'').trim().toUpperCase();
  if(!/^DEMO-[A-Z0-9-]{3,40}$/.test(lock))throw Error('演示锁 ID 请使用 DEMO- 开头，后接字母、数字或短横线');
  if(c.lock&&c.lock!==lock)throw Error('该柜门已有固定锁。更换锁需单独处理，本 Demo 不支持直接覆盖绑定');
  if(next.cabinets.some(x=>x.id!==id&&x.lock===lock))throw Error('这把锁已绑定其他柜门，请核对实物后重新扫描');
  if(!data.checks||!data.photo)throw Error('请完成全部现场确认并添加示例挂锁记录');
  c.lock=lock;c.status='review';c.binding={actor:'李工',at:new Date().toLocaleString('zh-CN'),photo:'示例挂锁记录（模拟，无实物照片）',checks:true};delete c.reason;
  actor='李工 · 电气操作';text=`模拟绑定 ${lock} 至 ${c.door}，提交现场复核`;
 }else if(action==='approve'||action==='reject'){
  if(c.status!=='review')throw Error('只有待复核的记录可以处理');
  if(!data.actor||data.actor===c.binding?.actor)throw Error('演示规则：绑定人不能复核自己的记录');
  actor=`${data.actor} · 现场复核`;
  if(action==='approve'){
   if(!data.checked)throw Error('请先确认已完成现场复核');
   c.status='ready';text='现场复核通过，台账可用；不代表允许送电';
  }else{
   if(!data.reason?.trim())throw Error('请填写退回原因');
   c.status='binding';c.reason=data.reason.trim();text=`退回现场：${c.reason}（保留原绑定供核对）`;
  }
 }else throw Error('未知操作');
 c.events.unshift({at:new Date().toLocaleString('zh-CN'),actor,text});return next;
}

${ui.mode==='web'?web():mobile()}
${ui.form?form():''}`;}
function web(){return `<div class="web-layout"><aside class="sidebar"><div class="sidebar-title">项目资料</div>${[['register','box','配电柜台账'],['equipment','grid','设备与供电关系'],['rooms','pin','舱室目录'],['review','check','现场复核'],['history','clock','建档记录']].map(([id,icon,label])=>`<button data-page="${id}" class="nav-item ${ui.page===id?'active':''}">${ico(icon)}${label}${id==='review'?`<em>${state.cabinets.filter(c=>c.status==='review').length}</em>`:''}</button>`).join('')}<div class="sidebar-note">${ico('file',24)}<b>从图纸走到现场</b><p>图纸资料 → 实物核对<br>固定锁绑定 → 现场复核</p><span>本 Demo 不执行送电授权</span></div><div class="profile"><span class="avatar">${ui.page==='review'?'周':'陈'}</span><div>${ui.page==='review'?'周工':'陈宁'}<small>${ui.page==='review'?'现场复核 · 演示身份':'资料维护员 · 演示身份'}</small></div></div></aside><main class="main">${ui.page==='register'?register():ui.page==='equipment'?equipment():ui.page==='rooms'?rooms():ui.page==='review'?reviewPage():historyPage()}<footer>图纸字段来自推进遥控接线图 · 柜门、锁 ID 与建档状态为演示数据</footer></main></div>`;}
function heading(eyebrow,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${actions}</div>`;}
function register(){const list=state.cabinets.filter(c=>(ui.filter==='all'||c.status===ui.filter)&&(ui.room==='all'||c.room===ui.room)&&`${c.id} ${c.name} ${c.short} ${c.lock}`.toLowerCase().includes(ui.query.toLowerCase()));if(list.length&&!list.some(c=>c.id===ui.selected))select(list[0].id);return `${heading('PROJECT / 01','配电柜台账','先把柜门、设备和固定锁对上，再交给现场使用。',`<button class="primary" data-action="new">${ico('plus',18)} 新建配电柜</button>`)}
<div class="workflow-strip">${Object.entries(STATUS).map(([id,label],i)=>`<button data-filter="${ui.filter===id?'all':id}" class="stage ${ui.filter===id?'selected':''}"><span class="stage-no">0${i+1}</span><div><b>${label}</b><small>${['整理图纸与位置','核对实物并挂锁','由另一人检查','可用于创建任务'][i]}</small></div><strong>${state.cabinets.filter(c=>c.status===id).length}</strong></button>`).join('')}</div>
<div class="register-grid"><section class="register-list"><div class="list-toolbar"><label class="search">${ico('search',17)}<input id="search" placeholder="搜索柜号、名称或锁 ID" value="${esc(ui.query)}" aria-label="搜索配电柜"></label><select id="room-filter" aria-label="筛选舱室"><option value="all">全部舱室</option>${state.rooms.map(r=>`<option value="${esc(r.id)}" ${ui.room===r.id?'selected':''}>${esc(r.id)} · ${esc(r.name)}</option>`).join('')}</select></div><div class="list-caption"><span>${ui.filter==='all'?'全部建档状态':STATUS[ui.filter]} · ${list.length} 个配电柜</span>${ui.filter!=='all'?'<button class="text-btn" data-filter="all">清除状态筛选</button>':'<span>按配电柜管理固定锁</span>'}</div><div class="table-scroll"><table><thead><tr><th>配电柜 / 编号</th><th>位置</th><th>建档进度</th><th></th></tr></thead><tbody>${list.map(c=>`<tr class="${c.id===ui.selected?'selected':''}"><td><button class="row-link" data-select="${esc(c.id)}"><b>${esc(c.short)}</b><span>${esc(c.name)}</span><small>${esc(c.id)}</small></button></td><td><span class="room-code">${esc(c.room)}</span><small>${esc(roomName(c.room))}</small></td><td>${badge(c.status)}<small>${c.lock?esc(c.lock):'尚未绑定固定锁'}</small></td><td><button class="icon-btn" data-select="${esc(c.id)}" aria-label="查看 ${esc(c.short)}">${ico('arrow',17)}</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">没有匹配的配电柜。请调整搜索或筛选。</td></tr>'}</tbody></table></div><div class="list-bottom">${ico('file',16)} 图纸信息可提前录入，柜门和锁需现场核对。</div></section>${list.length?detail(cabinet()):'<aside class="detail empty">选择匹配的配电柜后查看详情。</aside>'}</div>`;}
function doorDrawing(c){return `<div class="cabinet-visual"><div class="cabinet-sketch"><div class="cabinet-label">${esc(c.short)}</div><div class="vents">━━ ━━ ━━</div><div class="door-seam"></div><div class="handle"></div><div class="sketch-lock ${c.lock?'bound':''}">${ico('lock',20)}</div><div class="sketch-foot">${esc(c.door)}</div></div><div class="callout"><span class="callout-line"></span><small>固定挂锁位置 · 示意</small><b>${c.lock?esc(c.lock):'待现场绑定'}</b><span>锁固定在柜门上<br>不直接绑定到设备</span></div></div>`;}
function detail(c){if(!c)return '';return `<aside class="detail"><div class="detail-header"><span>台账详情</span><span class="muted">${esc(c.id)}</span></div><div class="detail-title"><h2>${esc(c.short)}</h2>${badge(c.status)}</div><p class="detail-name">${esc(c.name)}</p>${doorDrawing(c)}<div class="detail-tabs"><button data-tab="info" class="${ui.tab==='info'?'active':''}">基本资料</button><button data-tab="links" class="${ui.tab==='links'?'active':''}">设备关系 <em>${c.links.length}</em></button><button data-tab="logs" class="${ui.tab==='logs'?'active':''}">记录</button></div><div class="detail-content">${ui.tab==='info'?`<dl><dt>所在舱室</dt><dd>${esc(roomName(c.room))} / ${esc(c.room)}</dd><dt>柜门 / 挂锁点</dt><dd>${esc(c.door)} <span class="subtle">演示假设</span></dd><dt>固定锁 ID</dt><dd>${esc(c.lock||'待现场扫描')}</dd><dt>资料来源</dt><dd>${sourceLine(c)}</dd></dl><div class="info-note">${ico('file',16)}<span>${esc(c.note||'暂无补充说明')}</span></div>`:ui.tab==='links'?`<p class="subtle">图纸中的连接线索，供电范围仍需专业核对。</p>${c.links.map(id=>{const e=state.equipment.find(e=>e.id===id);return `<div class="relation-item">${ico('grid',18)}<div><b>${esc(e?.name||id)}</b><small>${esc(id)}</small></div></div>`;}).join('')||'<p class="empty">尚未关联设备，可在资料草稿中补充。</p>'}<div class="warning">一台设备可能对应多个电源柜。关联记录不代表完整隔离方案。</div>`:timeline(c.events)}${c.reason?`<div class="warning"><b>现场复核退回</b><br>${esc(c.reason)}</div>`:''}</div><div class="detail-actions">${c.status==='draft'?'<button class="secondary" data-action="edit">编辑资料</button><button class="primary" data-action="dispatch">交给现场 '+ico('arrow',16)+'</button>':c.status==='binding'?'<button class="primary full" data-action="go-mobile">在手机端核对并绑定 '+ico('arrow',16)+'</button>':c.status==='review'?'<button class="primary full" data-page="review">进入现场复核 '+ico('arrow',16)+'</button>':'<div class="ready-note">'+ico('check',18)+' 台账已可用；送电仍需独立审批。</div>'}</div></aside>`;}
function equipment(){return `${heading('PROJECT / 02','设备与供电关系','设备的位置和电源柜的位置分开记录。','<button class="primary" data-action="new-equipment">'+ico('plus',18)+' 新增设备</button>')}<div class="notice">${ico('file')}<div><b>当前展示图纸连接线索</b><p>未核定完整供电范围。信号采集箱的通信连接，不自动归入供电关系。</p></div></div><div class="equipment-list">${state.equipment.map(e=>{const related=state.cabinets.filter(c=>c.links.includes(e.id));return `<article class="equipment-row"><div class="equipment-symbol">${ico('grid',26)}</div><div class="equipment-main"><small>${esc(e.id)}</small><h2>${esc(e.name)}</h2><p>${ico('pin',14)} ${esc(roomName(e.room))}</p><small>来源：${esc(e.source||SOURCE)}${e.page?' / 第 '+e.page+' 页':''}</small></div><div class="power-links"><span class="eyebrow">关联配电柜 · ${related.length}</span>${related.map(c=>`<button data-open="${esc(c.id)}">${ico('box',18)}<b>${esc(c.short)}</b><span>舱室 ${esc(c.room)}</span>${ico('arrow',16)}</button>`).join('')||'<p class="subtle">尚未核定供电关系</p>'}${related.length>1?'<small class="amber-text">多个电源柜，需分别核对</small>':''}</div></article>`;}).join('')}</div>`;}
function rooms(){return `${heading('PROJECT / 03','舱室目录','保留船厂编号，统一位置名称，避免同名误认。','<button class="primary" data-action="new-room">'+ico('plus',18)+' 新增舱室</button>')}<div class="room-layout"><div class="deck-plan"><div class="eyebrow">LOCATION INDEX</div><h2>从位置找到资产</h2><div class="ship-outline"><div>艏部</div><span>202<br><small>艏侧推间2</small></span><span>208<br><small>右舷配电板间</small></span><span>232<br><small>右舷推进器间</small></span><div>艉部</div></div><p>位置索引示意<br>非实际船舶布置图，不表达舱室比例或相邻关系。</p></div><section class="room-list">${state.rooms.map(r=>`<article><div class="room-index">${esc(r.id)}</div><div><h3>${esc(r.name)}</h3><p>${r.temporary?'图上未取得舱号，'+esc(r.id)+' 为演示索引':r.source?'编号与位置来自图纸':'人工新增 · 演示资料'}</p><small>${state.cabinets.filter(c=>c.room===r.id).length} 个配电柜 · ${state.equipment.filter(e=>e.room===r.id).length} 台设备</small></div><button class="icon-btn" data-room="${esc(r.id)}" aria-label="查看舱室 ${esc(r.id)} 的配电柜">${ico('arrow')}</button></article>`).join('')}</section></div>`;}
function reviewPage(){const pending=state.cabinets.filter(c=>c.status==='review');const c=pending.find(c=>c.id===ui.selected)||pending[0];return `${heading('PROJECT / 04','现场复核','检查实物、柜门与固定锁的对应关系。当前以周工身份演示。')}<div class="review-grid"><section><div class="section-label">待复核 · ${pending.length}</div>${pending.map(c=>`<button class="review-select ${c.id===(pending.find(x=>x.id===ui.selected)||pending[0])?.id?'active':''}" data-select="${esc(c.id)}"><div><b>${esc(c.short)}</b><small>${esc(c.name)}</small><span>${esc(c.lock)}</span></div>${ico('arrow')}</button>`).join('')||'<div class="empty large">'+ico('check',32)+'<h2>当前没有待复核记录</h2><p>去手机端完成现场绑定后，记录会出现在这里。</p><button class="secondary" data-action="go-mobile">打开手机端</button></div>'}<div class="info-note">${ico('users',18)}<span>演示方案：绑定与复核由不同人员完成。实际人员资格仍待业务确认。</span></div></section>${c?`<section class="review-sheet"><div class="eyebrow">FIELD VERIFICATION</div><h2>${esc(c.short)} · ${esc(c.door)}</h2>${reviewContent(c)}<label class="checkline"><input id="desktop-review-check" type="checkbox">已在现场核对柜门、固定锁 ID 与资料一致</label><div class="review-buttons"><button class="secondary" data-reject="${esc(c.id)}">退回现场</button><button class="primary" data-approve="${esc(c.id)}">复核通过 ${ico('check',17)}</button></div><p class="subtle">本按钮只改变台账状态，不构成送电许可或无电确认。</p></section>`:''}</div>`;}
function reviewContent(c){return `<dl><dt>配电柜编号</dt><dd>${esc(c.id)}</dd><dt>位置</dt><dd>${esc(roomName(c.room))} / ${esc(c.room)}</dd><dt>固定锁 ID</dt><dd><b>${esc(c.lock)}</b><span class="subtle"> 模拟锁</span></dd><dt>现场绑定人</dt><dd>${esc(c.binding?.actor||'—')} · ${esc(c.binding?.at||'—')}</dd></dl><div class="evidence"><div class="evidence-illustration">${ico('box',44)}${ico('lock',25)}</div><div><b>示例挂锁记录</b><small>模拟占位，无实物照片</small><span>柜门与锁 ID 已由演示操作人勾选确认</span></div></div>`;}
function timeline(events){return `<div class="timeline">${events.map(e=>`<article><i></i><small>${esc(e.at)}</small><p>${esc(e.text)}</p><b>${esc(e.actor)}</b></article>`).join('')}</div>`;}
function historyPage(){const events=state.cabinets.flatMap(c=>c.events.map(e=>({...e,text:`${c.short} · ${e.text}`})));return `${heading('PROJECT / 05','建档记录','保留每次资料交接、绑定与复核的过程。')}<div class="notice">本地演示记录可重置，不是生产审计日志。</div><section class="history-sheet">${timeline(events)}</section>`;}
function mobile(){let c=cabinet();return `<main class="mobile-stage"><aside class="mobile-context"><div class="eyebrow">FIELD WORKSPACE</div><h1>资料在电脑整理。<br>绑定到现场完成。</h1><p>找到配电柜，核对柜门，再扫描固定锁。<br>每一步都围绕现场实物展开。</p><ol><li class="${ui.role==='electrician'?'current':''}"><span>01</span><div><b>李工 · 电气操作</b><p>核对位置、绑定固定锁、提交复核</p></div></li><li class="${ui.role==='reviewer'?'current':''}"><span>02</span><div><b>周工 · 现场复核</b><p>检查绑定关系，通过或退回</p></div></li></ol><div class="mobile-context-note">${ico('lock',22)}<div><b>固定的是柜门，不是某台设备</b><p>日常解锁不解除台账绑定。柜门锁闭不表示柜内设备无电。</p></div></div><button class="text-btn" data-mode="web">${ico('back',16)} 回到 Web 管理端查看台账</button></aside><div class="phone-wrap"><div class="phone-label">手机端交互预览 <span>本地共享演示数据</span></div><section class="phone"><div class="phone-top"><b>9:41</b><span>●●● ▰</span></div><div class="mobile-header"><span>${ico('ship',20)} 现场建档</span><b>CMHI-168-1</b></div><div class="mobile-role"><button data-role="electrician" class="${ui.role==='electrician'?'active':''}">李工 · 现场绑定</button><button data-role="reviewer" class="${ui.role==='reviewer'?'active':''}">周工 · 现场复核</button></div><div class="mobile-body"><label class="mobile-picker">选择配电柜<select id="mobile-cabinet">${state.cabinets.map(x=>`<option value="${esc(x.id)}" ${x.id===c?.id?'selected':''}>${esc(x.short)} · ${STATUS[x.status]}</option>`).join('')}</select></label>${c?mobileCard(c):'<div class="empty">先在 Web 建立配电柜资料。</div>'}</div><div class="phone-bottom">${ico('box',17)} 建档工作台<span>模拟 NFC · 不执行开锁</span></div></section></div></main>`;}
function mobileCard(c){return `<div class="mobile-title">${badge(c.status)}<h2>${esc(c.short)}</h2><p>${esc(c.name)}</p><small>${esc(c.id)}</small></div><div class="mobile-location">${ico('pin',18)}<div>${esc(roomName(c.room))}<small>舱室 ${esc(c.room)} · ${esc(c.door)}（演示）</small></div></div>${c.reason?`<div class="warning"><b>请按复核意见重新核对</b><br>${esc(c.reason)}</div>`:''}${ui.role==='reviewer'?c.status==='review'?`<div class="mobile-section-title">现场绑定记录</div>${reviewContent(c)}<label class="checkline"><input id="mobile-review-check" type="checkbox" ${ui.reviewCheck?'checked':''}>已到场复核柜门、锁 ID 与资料一致</label><div class="mobile-actions"><button class="secondary" data-reject="${esc(c.id)}">退回</button><button class="primary" data-approve="${esc(c.id)}">复核通过</button></div>`:`<div class="mobile-message">${ico(c.status==='ready'?'check':'clock',28)}<h3>${c.status==='ready'?'这份台账已通过复核':'等待现场绑定提交'}</h3><p>${c.status==='ready'?'固定锁：'+esc(c.lock):'只有现场人员提交后，才可以进行复核。'}</p></div>`:c.status==='binding'?bindingForm(c):c.status==='draft'?`<div class="mobile-message">${ico('file',28)}<h3>资料还在整理中</h3><p>请由资料维护员在 Web 端补齐资料，交给现场后再绑定。</p><button class="secondary" data-open="${esc(c.id)}">查看 Web 资料</button></div>`:`<div class="mobile-message">${ico(c.status==='ready'?'check':'clock',30)}<h3>${c.status==='ready'?'台账已可用':'已提交，等待现场复核'}</h3><p>固定锁：${esc(c.lock)}<br>${c.status==='ready'?'送电必须另行申请和审批。':'请由周工核对实物与绑定关系。'}</p>${c.status==='review'?'<button class="secondary" data-role="reviewer">切换到周工，演示复核</button>':''}</div>`}<div class="mobile-safety">柜门锁闭 ≠ 设备断电。照片和台账不能替代现场电气安全确认。</div>`;}
function bindingForm(c){return `<div class="mobile-section-title"><span>01</span> 核对现场实物</div><div class="check-group">${['船号、舱室与配电柜编号一致','柜门与挂锁位置一致','已按现场规程完成必要确认'].map((label,i)=>`<label class="checkline"><input type="checkbox" data-check="${i}" ${ui.checks[i]?'checked':''}>${label}</label>`).join('')}</div><div class="mobile-section-title"><span>02</span> 扫描固定锁</div><div class="scan-area"><div class="scan-icon">${ico('scan',32)}</div><p>${ui.scan?esc(ui.scan):'将手机靠近柜门上的固定锁'}</p><small>演示扫描仅填入模拟 ID，不操作硬件</small><button class="secondary" data-action="scan">${ico('scan',17)} ${ui.scan?'重新模拟扫描':'模拟 NFC 扫描'}</button><details><summary>手动输入 / 演示重复锁</summary><label>模拟锁 ID<input id="lock-input" value="${esc(ui.scan)}" placeholder="例如 DEMO-LOCK-008"></label><button class="text-btn" data-action="duplicate">使用已绑定锁测试拦截</button></details></div><div class="mobile-section-title"><span>03</span> 记录挂锁情况</div><button class="photo-button ${ui.photo?'done':''}" data-action="photo">${ico(ui.photo?'check':'camera',23)}<span>${ui.photo?'示例挂锁记录已添加':'添加示例挂锁记录'}<small>模拟占位，不调用相机</small></span></button><label class="checkline latch"><input id="latch" type="checkbox" ${ui.checks[3]?'checked':''}>已实际挂锁并手动闭锁（演示确认）</label><button class="primary full" data-action="bind" ${!ui.checks.slice(0,3).every(Boolean)||!ui.checks[3]||!ui.scan||!ui.photo?'disabled':''}>提交现场复核 ${ico('arrow',17)}</button>`;}
function form(){if(ui.form.kind==='reset')return `<div class="overlay"><section class="form-panel compact" role="dialog" aria-modal="true" aria-labelledby="form-title"><button class="close icon-btn" data-action="close" aria-label="关闭">${ico('x')}</button><h2 id="form-title">重置这套演示？</h2><p>只清除本 Demo 在当前浏览器保存的资料，恢复初始样例。原有原型不受影响。</p><button class="danger" data-action="confirm-reset">确认重置</button></section></div>`;
if(ui.form.kind==='reject')return `<div class="overlay"><form class="form-panel compact" id="reject-form" role="dialog" aria-modal="true" aria-labelledby="form-title"><button type="button" class="close icon-btn" data-action="close" aria-label="关闭">${ico('x')}</button><div class="eyebrow">RETURN TO FIELD</div><h2 id="form-title">退回现场重新核对</h2><label>退回原因<textarea name="reason" required maxlength="500" placeholder="例如：柜门编号与资料不一致，请重新核对。"></textarea></label><p class="subtle">保留当前锁绑定与操作记录，等待现场更正后再次提交。</p><button class="primary" type="submit">退回现场</button></form></div>`;
if(ui.form.kind==='equipment')return `<div class="overlay"><form class="form-panel compact" id="equipment-form" role="dialog" aria-modal="true" aria-labelledby="form-title"><button type="button" class="close icon-btn" data-action="close" aria-label="关闭">${ico('x')}</button><div class="eyebrow">EQUIPMENT</div><h2 id="form-title">新增设备资料</h2><label>设备编号<input name="id" required maxlength="60" placeholder="沿用图纸编号"></label><label>设备名称<input name="name" required maxlength="100"></label><label>安装舱室<select name="room">${state.rooms.map(r=>`<option value="${esc(r.id)}">${esc(r.id)} · ${esc(r.name)}</option>`).join('')}</select></label><label>资料来源<input name="source" required maxlength="150" value="${SOURCE}"></label><p class="subtle">保存后，可在配电柜资料草稿中选择关联该设备。供电关系仍需核对。</p><button class="primary" type="submit">保存设备资料</button></form></div>`;
if(ui.form.kind==='room')return `<div class="overlay"><form class="form-panel compact" id="room-form" role="dialog" aria-modal="true" aria-labelledby="form-title"><button type="button" class="close icon-btn" data-action="close" aria-label="关闭">${ico('x')}</button><div class="eyebrow">LOCATION</div><h2 id="form-title">新增舱室</h2><label>舱室编号<input name="id" required maxlength="40" placeholder="如 210"></label><label>完整位置名称<input name="name" required maxlength="100" placeholder="如 中间甲板 · 右舷配电板间"></label><button class="primary" type="submit">保存舱室</button></form></div>`;
const c=ui.form.kind==='edit'?cabinet():null;return `<div class="overlay"><form class="form-panel" id="cabinet-form" role="dialog" aria-modal="true" aria-labelledby="form-title"><button type="button" class="close icon-btn" data-action="close" aria-label="关闭">${ico('x')}</button><div class="eyebrow">ASSET REGISTRATION</div><h2 id="form-title">${c?'编辑资料草稿':'新建配电柜'}</h2><p>先整理图纸信息，固定锁留到现场绑定。</p><div class="form-grid"><label>配电柜编号<input name="id" required maxlength="60" value="${esc(c?.id||'')}" ${c?'readonly':''} placeholder="沿用图纸编号"></label><label>简称<input name="short" required maxlength="24" value="${esc(c?.short||'')}" placeholder="如 MDP2"></label></div><label>配电柜名称<input name="name" required maxlength="100" value="${esc(c?.name||'')}" placeholder="填写图纸上的名称"></label><div class="form-grid"><label>所在舱室<select name="room">${state.rooms.map(r=>`<option value="${esc(r.id)}" ${c?.room===r.id?'selected':''}>${esc(r.id)} · ${esc(r.name)}</option>`).join('')}</select></label><label>柜门 / 挂锁点<input name="door" required maxlength="50" value="${esc(c?.door||'前门 A')}" placeholder="需现场复核"></label></div><label>资料来源<input name="source" required maxlength="150" value="${esc(c?.source||SOURCE)}"></label><label>图纸页码（可选）<input name="page" type="number" min="1" max="9999" value="${c?.page||''}"></label><fieldset><legend>关联设备 · 连接线索待核对</legend>${state.equipment.map(e=>`<label class="checkline"><input name="links" type="checkbox" value="${esc(e.id)}" ${c?.links.includes(e.id)?'checked':''}>${esc(e.name)}</label>`).join('')}</fieldset><label>补充说明<textarea name="note" maxlength="500" placeholder="记录回路线索或待现场确认的问题">${esc(c?.note||'')}</textarea></label><div class="form-footer"><button type="button" class="secondary" data-action="close">取消</button><button type="submit" class="primary">保存资料草稿</button></div></form></div>`;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a.brand');if(!b)return;
 if(b.matches('a.brand')){e.preventDefault();ui.mode='web';ui.page='register';render();return;}
 if(b.dataset.mode){ui.mode=b.dataset.mode;location.hash=ui.mode==='mobile'?'mobile':'web';render();return;}
 if(b.dataset.page){ui.page=b.dataset.page;ui.mode='web';render();return;}
 if(b.dataset.select){select(b.dataset.select);render();return;}
 if(b.dataset.open){select(b.dataset.open);ui.mode='web';ui.page='register';ui.filter='all';ui.room='all';ui.query='';render();return;}
 if(b.dataset.filter){ui.filter=b.dataset.filter;render();return;}
 if(b.dataset.room){ui.room=b.dataset.room;ui.page='register';ui.filter='all';ui.query='';render();return;}
 if(b.dataset.tab){ui.tab=b.dataset.tab;render();return;}
 if(b.dataset.role){ui.role=b.dataset.role;ui.reviewCheck=false;render();return;}
 if(b.dataset.approve){ui.selected=b.dataset.approve;const checked=!!($('#desktop-review-check')||$('#mobile-review-check'))?.checked;run('approve',{actor:'周工',checked});return;}
 if(b.dataset.reject){ui.selected=b.dataset.reject;ui.form={kind:'reject'};render();focusForm();return;}
 const action=b.dataset.action;
 if(action==='new'||action==='edit'||action==='new-room'||action==='new-equipment'||action==='reset'){ui.form={kind:action==='new-room'?'room':action==='new-equipment'?'equipment':action};render();focusForm();}
 if(action==='close'){ui.form=null;render();}
 if(action==='dispatch')run('dispatch');
 if(action==='go-mobile'){ui.mode='mobile';ui.role='electrician';render();}
 if(action==='scan'){ui.scan=cabinet().lock||`DEMO-LOCK-${String(state.cabinets.indexOf(cabinet())+1).padStart(3,'0')}`;render();toast('已模拟读取锁 ID，请核对后提交。');}
 if(action==='duplicate'){ui.scan=state.cabinets.find(c=>c.id!==ui.selected&&c.lock)?.lock||'DEMO-LOCK-008';render();toast('已填入另一柜门的锁，用于演示重复绑定拦截。');}
 if(action==='photo'){ui.photo=!ui.photo;render();}
 if(action==='bind')run('bind',{lock:ui.scan,checks:ui.checks.length>=4&&ui.checks.every(Boolean),photo:ui.photo});
 if(action==='confirm-reset'){state=initialState();ui.form=null;ui.filter='all';ui.query='';ui.room='all';select(state.cabinets[0].id);save();render();toast('已恢复初始样例');}
 if(action==='export'){const blob=new Blob([JSON.stringify({demo:true,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='船舶台账-演示记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出当前演示台账与记录');}
});
function focusForm(){requestAnimationFrame(()=>$('.form-panel input:not([readonly]),.form-panel textarea,.form-panel button')?.focus());}
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;ui.query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos);}if(e.target.id==='lock-input'){ui.scan=e.target.value;const btn=$('[data-action="bind"]');if(btn)btn.disabled=!(ui.checks.length>=4&&ui.checks.every(Boolean)&&ui.photo&&ui.scan);}});
document.addEventListener('change',e=>{if(e.target.id==='room-filter'){ui.room=e.target.value;render();}if(e.target.id==='mobile-cabinet'){select(e.target.value);render();}if(e.target.dataset.check!==undefined){ui.checks[+e.target.dataset.check]=e.target.checked;render();}if(e.target.id==='latch'){ui.checks[3]=e.target.checked;render();}if(e.target.id==='mobile-review-check')ui.reviewCheck=e.target.checked;});
document.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);
 if(e.target.id==='reject-form'){const reason=String(fd.get('reason')||'').trim();if(!reason)return toast('请填写退回原因');ui.form=null;run('reject',{actor:'周工',reason});}
 if(e.target.getAttribute('id')==='equipment-form'){const data=Object.fromEntries(fd);for(const k of ['id','name','room','source']){data[k]=String(data[k]||'').trim();if(!data[k])return toast('请填写完整设备资料');}if(state.equipment.some(x=>x.id.toLowerCase()===data.id.toLowerCase()))return toast('设备编号已存在');state.equipment.push({...data,page:null});save();ui.form=null;render();toast('设备资料已新增，关联供电关系仍需核对');}
 if(e.target.getAttribute('id')==='room-form'){const id=String(fd.get('id')).trim(),name=String(fd.get('name')).trim();if(!id||!name)return toast('请填写完整舱室资料');if(state.rooms.some(r=>r.id.toLowerCase()===id.toLowerCase()))return toast('舱室编号已存在');state.rooms.push({id,name,source:false});save();ui.form=null;render();toast('舱室已新增');}
 if(e.target.getAttribute('id')==='cabinet-form'){
  const data=Object.fromEntries(fd);for(const key of ['id','short','name','room','door','source']){data[key]=String(data[key]||'').trim();if(!data[key])return toast('请补齐必填资料');}
  const editing=ui.form.kind==='edit';if(editing&&cabinet().status!=='draft')return toast('当前状态不能编辑资料');if(!editing&&state.cabinets.some(c=>c.id.toLowerCase()===data.id.toLowerCase()))return toast('配电柜编号已存在');
  const record={...data,page:Number(data.page)||null,links:fd.getAll('links'),status:'draft',lock:'',events:[{at:new Date().toLocaleString('zh-CN'),actor:'陈宁 · 资料维护',text:editing?'更新资料草稿':'新建配电柜资料草稿'}]};
  if(editing){record.events.push(...cabinet().events);state.cabinets[state.cabinets.findIndex(c=>c.id===data.id)]=record;}else state.cabinets.push(record);
  save();select(data.id);ui.form=null;ui.filter='all';ui.room='all';ui.query='';render();toast('资料草稿已保存');
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.form){ui.form=null;render();}if(e.key==='Tab'&&ui.form){const els=[...document.querySelectorAll('.form-panel button,.form-panel input,.form-panel select,.form-panel textarea')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('storage',e=>{if(e.key===KEY){try{const updated=JSON.parse(e.newValue);if(updated?.version===1){state=updated;render();toast('已同步同一浏览器内的演示改动');}}catch{}}});
render();if(storageWarning)toast(storageWarning);
</script></body>
</html>
